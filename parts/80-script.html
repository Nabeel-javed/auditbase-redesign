<script>
(function(){
"use strict";
try { if("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch(e){}
var RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= ROUTER ================= */
var PAGES = ["home","console","report","detectors"];
function parseHash(){
  var h = location.hash || "#/";
  if(h.indexOf("#/") !== 0) return {page:"home", anchor:h.slice(1)};
  var rest = h.slice(2);
  if(rest.charAt(0) === "#") return {page:"home", anchor:rest.slice(1)};
  if(PAGES.indexOf(rest) > -1) return {page:rest, anchor:null};
  return {page:"home", anchor:null};
}
var rbar = document.getElementById("rbar");
function route(first){
  var r = parseHash();
  document.body.dataset.page = r.page;
  document.querySelectorAll("section[data-route]").forEach(function(s){
    s.classList.toggle("active", s.dataset.route === r.page);
  });
  document.querySelectorAll(".nav-links a").forEach(function(a){
    var n = a.getAttribute("data-nav") || "";
    a.classList.toggle("on", n === r.page || n === r.page + "-" + (r.anchor||""));
  });
  if(!first && !RM){
    rbar.style.transition = "none"; rbar.style.width = "0"; rbar.style.opacity = "1";
    void rbar.offsetWidth;
    rbar.style.transition = ""; rbar.style.width = "100%";
    setTimeout(function(){ rbar.style.opacity = "0"; rbar.style.width = "0"; }, 420);
  }
  var tip = document.getElementById("walltip");
  if(tip) tip.style.opacity = "0";
  if(r.anchor){
    var el = document.getElementById(r.anchor);
    if(el) setTimeout(function(){ el.scrollIntoView({behavior: RM ? "auto" : "smooth"}); }, 60);
  } else { window.scrollTo({top:0, behavior:"instant"}); }
  requestAnimationFrame(observeAll);
}
addEventListener("hashchange", function(){ route(false); });

/* ================= REVEALS + COUNTERS + RINGS =================
   deterministic viewport check (IO notification lag is ~1s after
   programmatic jumps in Chrome — unacceptable for reveals) */
var revealables = [];
function collectReveals(){
  revealables = Array.prototype.slice.call(
    document.querySelectorAll("section.active .rv, footer .rv, section.active .csring"));
}
function revealEl(el){
  if(el.classList.contains("csring")){ fillRing(el); return; }
  el.classList.add("in");
  el.querySelectorAll("[data-count]").forEach(countUp);
  if(el.matches("[data-count]")) countUp(el);
  el.querySelectorAll(".csring").forEach(fillRing);
}
function checkReveals(){
  var vh = innerHeight;
  for(var i = revealables.length - 1; i >= 0; i--){
    var rc = revealables[i].getBoundingClientRect();
    if(rc.top < vh * 0.94 && rc.bottom > -20){
      revealEl(revealables[i]);
      revealables.splice(i, 1);
    }
  }
  maybeStartFeed();
}
var rafPend = false;
function onScrollCheck(){
  if(rafPend) return; rafPend = true;
  requestAnimationFrame(function(){ rafPend = false; checkReveals(); });
}
addEventListener("scroll", onScrollCheck, {passive:true});
addEventListener("resize", onScrollCheck, {passive:true});
setInterval(function(){ if(revealables.length) checkReveals(); }, 400);
function observeAll(){ collectReveals(); checkReveals(); }
function countUp(el){
  if(el.dataset.done) return; el.dataset.done = 1;
  var target = parseInt(el.dataset.count,10);
  if(RM){ el.textContent = target; return; }
  var t0 = null;
  function tick(t){
    if(!t0) t0 = t;
    var p = Math.min((t - t0)/1100, 1); p = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(target * p);
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function fillRing(r){
  if(r.dataset.done) return; r.dataset.done = 1;
  var c = 2 * Math.PI * parseFloat(r.getAttribute("r"));
  var off = c * (1 - parseInt(r.dataset.score,10)/100);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ r.style.strokeDashoffset = off; }); });
}

/* ================= HERO SCANNER ================= */
var CODE = [
'<span class="c">// SPDX-License-Identifier: MIT</span>',
'<span class="k">pragma solidity</span> ^0.8.19;',
'',
'<span class="k">import</span> {IPriceOracle} <span class="k">from</span> <span class="s">"./interfaces/IPriceOracle.sol"</span>;',
'',
'<span class="k">contract</span> <span class="t">NovaVault</span> {',
'    <span class="k">mapping</span>(<span class="t">address</span> => <span class="t">uint256</span>) <span class="k">public</span> shares;',
'    <span class="t">IPriceOracle</span> <span class="k">public</span> oracle;',
'    <span class="t">address</span> <span class="k">public</span> guardian;',
'',
'    <span class="k">function</span> withdraw(<span class="t">uint256</span> amount) <span class="k">external</span> {',
'        <span class="k">require</span>(shares[msg.sender] >= amount, <span class="s">"insufficient"</span>);',
'        (<span class="t">bool</span> ok, ) = msg.sender.call{value: amount}(<span class="s">""</span>);',
'        <span class="k">require</span>(ok, <span class="s">"transfer failed"</span>);',
'        shares[msg.sender] -= amount;',
'    }',
'',
'    <span class="k">function</span> price() <span class="k">public view returns</span> (<span class="t">uint256</span>) {',
'        (, <span class="t">int256</span> p,,,) = oracle.latestRoundData();',
'        <span class="k">return</span> <span class="t">uint256</span>(p);',
'    }',
'',
'    <span class="k">function</span> setGuardian(<span class="t">address</span> g) <span class="k">external</span> { guardian = g; }',
'}'];
var FINDINGS = [
  {idx:1,  sev:"low",  chip:"L-01 FLOATING PRAGMA",       sub:"pin the compiler"},
  {idx:12, sev:"crit", chip:"C-01 REENTRANCY",            sub:"state update after call"},
  {idx:18, sev:"high", chip:"H-01 STALE ORACLE",          sub:"no staleness check"},
  {idx:22, sev:"med",  chip:"M-01 NO ACCESS CONTROL",     sub:"setGuardian() is open"}
];
var codearea = document.getElementById("codearea");
var LH = 21, PT = 16;
if(codearea){
  CODE.forEach(function(html,i){
    var d = document.createElement("div");
    d.className = "cl"; d.dataset.i = i;
    d.innerHTML = '<span class="no">'+(i+1)+'</span><span class="cd">'+(html||' ')+'</span>';
    codearea.appendChild(d);
  });
  var chipbox = document.getElementById("fchips");
  var headH = 46;
  FINDINGS.forEach(function(f){
    var c = document.createElement("div");
    c.className = "fchip c-"+f.sev;
    c.innerHTML = f.chip + '<small>'+f.sub+'</small>';
    c.style.top = (headH + PT + f.idx*LH + LH/2) + "px";
    chipbox.appendChild(c);
  });

  var lamp = document.getElementById("lamp"),
      phase = document.getElementById("phase"),
      pathn = document.getElementById("pathn"),
      led = document.getElementById("scanled"),
      card = document.getElementById("scancard"),
      ring = document.getElementById("cardring"),
      cscore = document.getElementById("cardscore"),
      stamp = document.getElementById("stamp");
  var lines = codearea.querySelectorAll(".cl");
  var token = 0, timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function lampTo(i){ lamp.style.transform = "translateY(" + (PT + i*LH + LH/2 - 18) + "px)"; }
  function mark(f){
    lines[f.idx].classList.add("f-"+f.sev, "flash");
    var chip = chipbox.children[FINDINGS.indexOf(f)];
    if(chip) chip.classList.add("show");
  }
  function sweep(from, to, dur, onLine, done){
    var my = token, t0 = null, last = -1;
    function tick(t){
      if(my !== token) return;
      if(!t0) t0 = t;
      var p = Math.min((t-t0)/dur, 1);
      var fi = from + (to-from)*p;
      lampTo(fi);
      var li = Math.round(fi);
      if(li !== last){
        var step = li > last ? 1 : -1;
        for(var l = last + step; step > 0 ? l <= li : l >= li; l += step){
          (function(el){
            if(el){ el.classList.add("lit"); setTimeout(function(){ el.classList.remove("lit"); }, 300); }
          })(lines[l]);
          if(onLine) onLine(l);
        }
        last = li;
      }
      if(p < 1) requestAnimationFrame(tick); else if(done) done();
    }
    requestAnimationFrame(tick);
  }
  function countPaths(target, dur){
    var my = token, t0 = null;
    function tick(t){
      if(my !== token) return;
      if(!t0) t0 = t;
      var p = Math.min((t-t0)/dur, 1);
      pathn.textContent = "PATH " + Math.round(target*p).toLocaleString() + " / " + target.toLocaleString();
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function setRing(score){
    var c = 163.4;
    ring.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)";
    ring.style.strokeDashoffset = c * (1 - score/100);
    var t0 = null;
    function tick(t){
      if(!t0) t0 = t;
      var p = Math.min((t-t0)/1100, 1);
      cscore.textContent = Math.round(score * (1 - Math.pow(1-p,3)));
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function endState(){
    FINDINGS.forEach(mark);
    phase.textContent = "REPORT READY — 12M 41S";
    card.classList.add("show"); stamp.classList.add("in");
    ring.style.strokeDashoffset = 163.4 * (1 - .58); cscore.textContent = "58";
  }
  function cycle(){
    token++;
    timers.forEach(clearTimeout); timers = [];
    lines.forEach(function(l){ l.className = "cl"; });
    chipbox.querySelectorAll(".fchip").forEach(function(c){ c.classList.remove("show"); });
    card.classList.remove("show"); stamp.classList.remove("in");
    ring.style.transition = "none"; ring.style.strokeDashoffset = 163.4; cscore.textContent = "0";
    led.className = "led"; pathn.textContent = "";
    phase.textContent = "PULLING SPECIMEN…";
    later(function(){
      led.className = "led busy";
      phase.textContent = "LAYER 1/3 — STATIC SWEEP · 247 DETECTORS";
      lamp.style.opacity = "1";
      sweep(0, 23, 4400, function(li){
        if(li === 1) mark(FINDINGS[0]);
        if(li === 22) mark(FINDINGS[3]);
      }, function(){
        phase.textContent = "LAYER 2/3 — SYMBOLIC EXECUTION";
        countPaths(2904, 2900);
        sweep(10, 15, 2600, function(li){
          if(li === 12){ mark(FINDINGS[1]); led.className = "led hot"; }
        }, function(){
          phase.textContent = "LAYER 3/3 — ADVERSARIAL REVIEW";
          pathn.textContent = "";
          lamp.style.opacity = "0";
          later(function(){ lines[18].classList.add("lit"); }, 500);
          later(function(){ mark(FINDINGS[2]); }, 1100);
          later(function(){
            phase.textContent = "REPORT READY — 12M 41S";
            led.className = "led";
            card.classList.add("show");
            later(function(){ setRing(58); }, 450);
            later(function(){ stamp.classList.add("in"); }, 900);
          }, 2100);
          later(function(){
            card.classList.remove("show"); stamp.classList.remove("in");
          }, 8200);
          later(cycle, 9200);
        });
      });
    }, 700);
  }
  if(RM){ endState(); } else { setTimeout(cycle, 900); }
}

var WALLDATA = [];
if(wall){
  var fams = {crit:"RE",high:"HX",med:"MD",low:"LW",info:"NC",gas:"GS"};
  WALLDIST.forEach(function(pair){
    var sev = pair[0];
    for(var n=1;n<=pair[1];n++){
      WALLDATA.push({sev:sev, code:fams[sev]+"-"+String(n).padStart(2,"0"),
        name:WALLNAMES[sev][(n-1) % WALLNAMES[sev].length]});
    }
  });
  var frag = document.createDocumentFragment();
  WALLDATA.forEach(function(d){
    var c = document.createElement("span");
    c.className = "cell sv-"+d.sev; c.textContent = d.code;
    c.dataset.sev = d.sev; c.dataset.name = d.name;
    frag.appendChild(c);
  });
  wall.appendChild(frag);
  var SEVLABEL = {crit:"CRITICAL",high:"HIGH",med:"MEDIUM",low:"LOW",info:"INFO",gas:"GAS"};
  var SEVVAR = {crit:"var(--crit)",high:"var(--high)",med:"var(--med)",low:"var(--low)",info:"var(--info)",gas:"var(--bone2)"};
  wall.addEventListener("mousemove", function(e){
    var t = e.target;
    if(!t.classList.contains("cell")){ walltip.style.opacity = "0"; return; }
    walltip.innerHTML = "<b>"+t.textContent+"</b> · "+t.dataset.name+
      '<div class="tsev" style="color:'+SEVVAR[t.dataset.sev]+'">'+SEVLABEL[t.dataset.sev]+" · RUNS ON EVERY SCAN</div>";
    walltip.style.opacity = "1";
    var x = Math.min(e.clientX + 16, innerWidth - 270);
    walltip.style.left = x + "px";
    walltip.style.top = (e.clientY + 18) + "px";
  });
  wall.addEventListener("mouseleave", function(){ walltip.style.opacity = "0"; });
  document.getElementById("wallfilter").addEventListener("click", function(e){
    var b = e.target.closest(".fbtn"); if(!b) return;
    this.querySelectorAll(".fbtn").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    var f = b.dataset.f, shown = 0;
    wall.querySelectorAll(".cell").forEach(function(c){
      var hit = (f === "all" || c.dataset.sev === f);
      c.classList.toggle("dim", !hit); if(hit) shown++;
    });
    document.getElementById("wallcount").textContent = shown + " / 247 SHOWN";
  });
  if(!RM) setInterval(function(){
    if(document.body.dataset.page !== "home") return;
    var cs = wall.children;
    var el = cs[Math.floor(Math.random()*cs.length)];
    el.classList.add("pulse");
    setTimeout(function(){ el.classList.remove("pulse"); }, 600);

    b.classList.add("on"); renderCat();
  });
  renderCat();
}

              1:"EST. <b>~45 MIN</b> · <b>20 CREDITS</b> — COVERED BY FREE TIER",
              2:"EST. <b>2–24 H</b> · <b>180 CREDITS</b> — 80 BEYOND FREE TIER"};

    var b = e.target.closest("button"); if(!b) return;

  });
});
